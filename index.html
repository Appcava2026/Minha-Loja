<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Jost',system-ui,sans-serif;background:#f6f6f6;color:#222;line-height:1.45}
body:not(.ok){visibility:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--dest2);outline-offset:2px}
.faixa{background:var(--faixa);display:flex;justify-content:center;gap:40px;padding:10px 2.5%;font-size:.9rem;flex-wrap:wrap;color:#444}
.faixa b{margin-right:6px}
header{background:var(--prim);color:var(--pt);display:flex;align-items:center;gap:24px;padding:14px 2.5%;position:sticky;top:0;z-index:5}
.logo{font-size:1.9rem;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.busca{flex:1;max-width:560px;margin:0 auto;display:flex;background:#fff;border-radius:3px;overflow:hidden}
.busca input{flex:1;border:0;padding:10px 12px;font:inherit;min-width:0}
.busca button{background:#000;color:#fff;padding:0 18px}
.carrinho{font-weight:600;white-space:nowrap}
nav{background:var(--prim);color:var(--pt);display:flex;gap:26px;padding:0 2.5% 12px;overflow-x:auto;font-size:.95rem}
nav button{white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}
nav button.on,nav button:hover{border-color:currentColor}
.hero{display:grid;grid-template-columns:1fr 2.7fr 1fr;gap:12px;padding:12px 2.5% 0;height:342px}
.lado{display:grid;grid-template-rows:repeat(3,1fr);gap:12px;min-height:0}
.tile{border-radius:8px;overflow:hidden;display:flex;align-items:center;text-align:left;background-size:cover;background-position:center}
.tile span{background:linear-gradient(90deg,#000,#000c 70%,#0000);color:#fff;font-weight:600;padding:12px 40px 12px 14px;font-size:1.05rem}
.rot{position:relative;overflow:hidden;border-radius:8px;background:var(--b1)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 7%;color:var(--ouro);opacity:0;transition:opacity .8s;background-size:cover;background-position:center}
.slide.on{opacity:1}
.slide small{font-size:1.2rem;font-weight:600;color:var(--bt)}
.slide h2{font-size:clamp(2.4rem,7vw,5rem);font-weight:700;line-height:1}
.slide p{color:var(--bt);font-size:1.3rem;margin:6px 0 18px}
.cta{align-self:flex-start;background:var(--cta);color:var(--ctat);padding:10px 26px;font-weight:600;text-decoration:none}
.s1{background-color:var(--b1)}.s2{background-color:var(--b2)}.s3{background-color:var(--b3)}
.s1:not([style]){background:var(--b1)}.s2:not([style]){background:var(--b2)}.s3:not([style]){background:var(--b3)}
.pontos{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:9px}
.pontos button{width:9px;height:9px;border-radius:50%;background:#fff6}
.pontos button.on{background:#fff;width:24px;border-radius:5px}
#promo{display:none;margin:12px 2.5% 0;border-radius:8px;background:var(--promo);color:#fff;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;padding:18px 20px}
#promo.ativa{display:flex}
#promo h3{font-size:1.5rem;font-weight:700;line-height:1.15;color:var(--pd)}
.relogio{position:relative;width:116px;height:116px;flex:none}
.relogio svg{transform:rotate(-90deg);width:100%;height:100%}
.relogio circle{fill:none;stroke-width:8}
.trilho{stroke:#fff3}.anel{stroke:var(--pd);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.relogio.urgente .anel{stroke:#ff4b52}.relogio.urgente{animation:pulsa 1s infinite}
@keyframes pulsa{50%{transform:scale(1.06)}}
.centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:700;font-size:1.3rem;line-height:1}
.centro small{font-size:.65rem;font-weight:500;margin-top:4px}
.blocos{display:flex;gap:8px}
.bloco{background:var(--dest2);color:#fff;border-radius:6px;padding:8px 10px;min-width:60px;text-align:center}
.bloco b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}.bloco span{font-size:.7rem}
.cats{display:flex;gap:26px;overflow-x:auto;padding:26px 2.5% 8px;justify-content:center}
.cat{flex:none;width:104px;text-align:center;font-weight:500}
.cat i{width:104px;height:104px;border-radius:38%;margin-bottom:8px;display:grid;place-content:center;font-style:normal;font-size:2.2rem;font-weight:700;color:#fff;background-size:cover;background-position:center}
main{padding:20px 2.5% 50px}
main h2{font-size:1.6rem;margin:18px 0 12px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:#fff;display:flex;flex-direction:column}
.foto{aspect-ratio:3/4;display:grid;place-content:center;font-size:3rem;font-weight:700;color:#fff;background-size:cover;background-position:center}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.preco{font-weight:700;font-size:1.2rem;color:var(--dest2)}
.antigo{text-decoration:line-through;color:#888;font-weight:400;font-size:.95rem;margin-right:6px}
.etiqueta{background:var(--dest2);color:#fff;font-size:.75rem;padding:1px 7px;align-self:flex-start;font-weight:600}
.btn{background:var(--btn);color:var(--btt);padding:10px 18px;font-weight:600;text-align:center}
.btn:hover{opacity:.85}
.vazio{grid-column:1/-1;padding:30px;text-align:center;color:#666}
#gaveta{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:#fff;box-shadow:-8px 0 30px #0004;transform:translateX(105%);transition:transform .3s;z-index:10;display:flex;flex-direction:column;padding:20px}
#gaveta.aberta{transform:none}
#itens{flex:1;overflow:auto;margin:14px 0}
.linha{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;gap:8px}
.qtd button{width:28px;height:28px;border-radius:50%;background:#eee}
.total{font-size:1.3rem;font-weight:700;display:flex;justify-content:space-between;margin-bottom:12px}
.msg{padding:10px;background:#d6f2df;text-align:center;display:none}
@media(max-width:820px){.hero{grid-template-columns:1fr;height:240px}.lado{display:none}header{flex-wrap:wrap;gap:10px}.busca{order:3;flex-basis:100%;max-width:none}.logo{font-size:1.5rem;margin-right:auto}.cats{justify-content:flex-start}.faixa{gap:14px;font-size:.8rem}}
@media(prefers-reduced-motion:reduce){.slide,.anel{transition:none}.relogio.urgente{animation:none}}

html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
.acoes{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.acoes .btn{flex:1 1 0;min-width:0}
.ic{width:44px;height:44px;flex:none;display:grid;place-content:center;border:1px solid #d9dedb;background:#fff;color:#444;border-radius:6px;text-decoration:none}
.ic.zap{background:#25d366;border-color:#25d366;color:#fff}
.ic svg{width:22px;height:22px;fill:currentColor}
.dest{outline:3px solid var(--dest2);outline-offset:-3px}
.busca input{font-size:16px}
#veu{position:fixed;inset:0;background:#0006;z-index:9;display:none}#veu.on{display:block}
#gaveta{height:100dvh;padding-bottom:max(20px,env(safe-area-inset-bottom))}
#fechar{width:44px;height:44px;font-size:1.2rem}
.cli{display:grid;gap:8px;margin-bottom:12px}
.cli input{padding:11px 12px;border:1px solid #cfd6d2;border-radius:6px;font:inherit;font-size:16px;width:100%}
.msg{padding:12px}.msg .btn{display:inline-block;margin-top:8px;text-decoration:none}
nav button{padding:8px 0}
@media(max-width:1100px){.hero{height:300px}.slide h2{font-size:clamp(2rem,6vw,3.4rem)}}
@media(max-width:820px){.carrinho{padding:8px 0}}
@media(max-width:560px){
 header{padding:10px 4%}.logo{font-size:1.3rem;letter-spacing:.08em}
 .faixa{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:8px 4%}
 nav{padding:0 4% 8px;gap:18px}
 .hero{height:200px;padding:10px 4% 0}.slide{padding:0 6%}.slide small{font-size:.95rem}.slide p{font-size:1rem;margin:4px 0 12px}.cta{padding:9px 18px}
 #promo{margin:10px 4% 0;gap:14px;padding:14px}#promo h3{font-size:1.2rem;text-align:center;width:100%}
 .relogio{width:92px;height:92px}.centro{font-size:1.05rem}.bloco{min-width:54px;padding:6px 8px}.bloco b{font-size:1.3rem}
 .cats{padding:18px 4% 4px;gap:16px}.cat{width:78px;font-size:.85rem}.cat i{width:78px;height:78px;font-size:1.7rem}
 main{padding:12px 4% 40px}main h2{font-size:1.3rem}
 .grade{grid-template-columns:repeat(2,1fr);gap:10px}.info{padding:10px}.preco{font-size:1.05rem}
 .acoes .btn{flex-basis:100%}.ic{flex:1;width:auto}
}
</style>
</head>
<body>
<div class="faixa"><span><b>Pix e cartão</b>pagamento seguro pelo Mercado Pago</span><span><b>Frete</b>combine pelo WhatsApp</span><span><b>Troca fácil</b>fale com a gente</span></div>
<header>
  <div class="logo" id="logo"></div>
  <form class="busca" id="busca" role="search"><input id="q" placeholder="Buscar peças" aria-label="Buscar"><button type="submit">Buscar</button></form>
  <button class="carrinho" id="abrir">Carrinho (<span id="cont">0</span>)</button>
</header>
<nav id="menu"></nav>
<div class="msg" id="msg"></div>
<section class="hero" id="hero"></section>
<section id="promo" aria-live="polite">
  <h3 id="promoTitulo"></h3>
  <div class="relogio" id="relogio">
    <svg viewBox="0 0 100 100"><circle class="trilho" cx="50" cy="50" r="44"/><circle class="anel" id="anel" cx="50" cy="50" r="44"/></svg>
    <div class="centro"><span id="restante"></span><small>restantes</small></div>
  </div>
  <div class="blocos">
    <div class="bloco"><b id="d">00</b><span>dias</span></div><div class="bloco"><b id="h">00</b><span>horas</span></div>
    <div class="bloco"><b id="m">00</b><span>min</span></div><div class="bloco"><b id="s">00</b><span>seg</span></div>
  </div>
</section>
<div class="cats" id="cats"></div>
<main id="conteudo"></main>
<div id="veu"></div>
<aside id="gaveta" aria-label="Carrinho">
  <div class="linha" style="border:0"><b style="font-size:1.3rem">Seu carrinho</b><button id="fechar" aria-label="Fechar">✕</button></div>
  <div id="itens"></div>
  <div class="cli"><input id="cliNome" placeholder="Seu nome" autocomplete="name"><input id="cliTel" placeholder="Seu WhatsApp com DDD" inputmode="tel" autocomplete="tel"></div>
  <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
  <button class="btn" id="pagar">Pagar com Mercado Pago</button>
</aside>

<script>
const TEMAS={
 verde:{prim:"#0f3d2e",pt:"#fff",dest:"#14683f",dest2:"#1a8a52",ouro:"#e6f4c8",bt:"#fff",faixa:"#eef6e8",btn:"#0f3d2e",btt:"#fff",cta:"#eef6e8",ctat:"#0f3d2e",pd:"#e6f4c8",
  b1:"radial-gradient(circle at 80% 50%,#2fb866,#0f5a37 70%)",b2:"radial-gradient(circle at 80% 50%,#2c4a3a,#0b1f17 70%)",b3:"radial-gradient(circle at 80% 50%,#6fcf97,#1b6b45 70%)",promo:"linear-gradient(100deg,#0b1f17,#14683f)"},
 preto:{prim:"#000",pt:"#fff",dest:"#111",dest2:"#d99a00",ouro:"#f5b800",bt:"#fff",faixa:"#f1efe9",btn:"#000",btt:"#fff",cta:"#f5b800",ctat:"#000",pd:"#f5b800",
  b1:"radial-gradient(circle at 80% 50%,#3a3a3a,#000 70%)",b2:"radial-gradient(circle at 80% 50%,#5a4600,#0a0a0a 70%)",b3:"radial-gradient(circle at 80% 50%,#444,#111 70%)",promo:"linear-gradient(100deg,#000,#3a2f00)"},
 vermelho:{prim:"#7a0c14",pt:"#fff",dest:"#b5121b",dest2:"#d01e27",ouro:"#f5d9a0",bt:"#fff",faixa:"#fbf5e9",btn:"#7a0c14",btt:"#fff",cta:"#fbf5e9",ctat:"#5a0c10",pd:"#f5d9a0",
  b1:"radial-gradient(circle at 80% 50%,#d92b30,#8f0c13 70%)",b2:"radial-gradient(circle at 80% 50%,#1f6f3f,#0b3a20 70%)",b3:"radial-gradient(circle at 80% 50%,#c43a55,#6e1228 70%)",promo:"linear-gradient(100deg,#2a0508,#8f0c13)"},
 amarelo:{prim:"#ffd400",pt:"#111",dest:"#111",dest2:"#e11d1d",ouro:"#111",bt:"#111",faixa:"#fff7c2",btn:"#111",btt:"#fff",cta:"#111",ctat:"#ffd400",pd:"#ffd400",
  b1:"radial-gradient(circle at 80% 50%,#ffe45c,#f5b800 70%)",b2:"radial-gradient(circle at 80% 50%,#ffd400,#e69500 70%)",b3:"radial-gradient(circle at 80% 50%,#fff176,#ffc400 70%)",promo:"linear-gradient(100deg,#111,#e11d1d)"}
};
const $=id=>document.getElementById(id),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bg=o=>o.foto?`background-image:url('${esc(o.foto)}')`:`background-color:${esc(o.cor||'#777')}`;
let CFG,filtro='todos',busca='',cart=[],atual=0,timer,t0,t1,estava=null;
try{cart=JSON.parse(localStorage.getItem('cart')||'[]').map(c=>({id:String(c.id),qtd:c.qtd}))}catch(e){}
const salvar=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};
const pa=()=>{const p=CFG.promo;return !!p&&p.ativa&&Date.now()>=t0&&Date.now()<t1};
const preco=p=>pa()&&p.promo!==false?Math.round(p.preco*(100-CFG.promo.desconto))/100:p.preco;
const catDe=p=>CFG.categorias.find(c=>c.id===p.cat)||{};

async function init(){
  try{CFG=await (await fetch('/api/loja',{cache:'no-store'})).json()}
  catch(e){document.body.innerHTML='<p style="padding:40px">Não foi possível carregar a loja agora. Tente novamente em instantes.</p>';document.body.classList.add('ok');return}
  const t=TEMAS[CFG.tema]||TEMAS.verde;Object.entries(t).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v));
  const nome=CFG.loja?.nome||'Minha Loja';$('logo').textContent=nome;document.title=nome;
  t0=new Date(CFG.promo?.inicio).getTime();t1=new Date(CFG.promo?.fim).getTime();
  $('menu').innerHTML=[{id:'todos',nome:'Todos'},...CFG.categorias].map(c=>`<button data-f="${esc(c.id)}">${esc(c.nome)}</button>`).join('');
  $('cats').innerHTML=CFG.categorias.map(c=>`<button class="cat" data-f="${esc(c.id)}"><i style="${bg(c)}">${c.foto?'':esc(c.nome[0])}</i>${esc(c.nome)}</button>`).join('');
  hero();$('anel').style.strokeDasharray=2*Math.PI*44;
  document.body.classList.add('ok');tick();setInterval(tick,1000);desenhar();desenharCarrinho();destacar();
  const q=new URLSearchParams(location.search).get('pago');
  if(q){const m=$('msg');m.style.display='block';
    m.textContent=q==='ok'?'Pagamento aprovado! Obrigado pela compra.':q==='pendente'?'Pagamento pendente. Avisaremos quando for confirmado.':'O pagamento não foi concluído. Tente novamente.';
    let ped=null;try{ped=JSON.parse(localStorage.getItem('pedido')||'null')}catch(e){}
    if(q!=='erro'&&ped&&CFG.loja?.whatsapp){const a=document.createElement('a');a.className='btn';a.target='_blank';a.rel='noopener';a.textContent='Enviar resumo do pedido para a loja no WhatsApp';a.href='https://wa.me/'+CFG.loja.whatsapp+'?text='+encodeURIComponent(ped.resumo);m.append(document.createElement('br'),a)}
    if(q==='ok'){cart=[];salvar();desenharCarrinho()}}
}

/* banner rotativo + atalhos */
function hero(){
  const cs=CFG.categorias.slice(0,6),sl=CFG.carrossel.filter(s=>s.ativo!==false);
  const tile=c=>`<button class="tile" data-f="${esc(c.id)}" style="${bg(c)}"><span>${esc(c.nome)}</span></button>`;
  $('hero').innerHTML=`<div class="lado">${cs.slice(0,3).map(tile).join('')}</div>
   <div class="rot" id="rot">${sl.map((s,i)=>`<div class="slide s${i%3+1}" ${s.foto?`style="background-image:linear-gradient(90deg,#000b,#0000),url('${esc(s.foto)}')"`:''}><small>${esc(s.sub)}</small><h2>${esc(s.titulo)}</h2><p>${esc(s.texto)}</p>${s.botao?`<a class="cta" href="#conteudo">${esc(s.botao)}</a>`:''}</div>`).join('')}<div class="pontos" id="pontos"></div></div>
   <div class="lado">${cs.slice(3,6).map(tile).join('')}</div>`;
  const ss=[...document.querySelectorAll('.slide')];
  ss.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Banner '+(i+1));b.onclick=()=>{ir(i);iniciar()};$('pontos').appendChild(b)});
  $('rot').onmouseenter=()=>clearInterval(timer);$('rot').onmouseleave=iniciar;ir(0);iniciar();
}
function ir(i){const ss=[...document.querySelectorAll('.slide')];atual=i;ss.forEach((s,k)=>s.classList.toggle('on',k===i));[...$('pontos').children].forEach((b,k)=>b.classList.toggle('on',k===i))}
function iniciar(){clearInterval(timer);const n=document.querySelectorAll('.slide').length;if(n>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>ir((atual+1)%n),5000)}

/* cronômetro */
const z=n=>String(n).padStart(2,'0');
function tick(){
  const ativa=pa(),falta=Math.max(0,t1-Date.now());$('promo').classList.toggle('ativa',ativa);
  if(ativa){const s=Math.floor(falta/1000);
    $('promoTitulo').innerHTML=esc(CFG.promo.nome)+'<br>'+CFG.promo.desconto+'% OFF';
    $('d').textContent=z(Math.floor(s/86400));$('h').textContent=z(Math.floor(s%86400/3600));$('m').textContent=z(Math.floor(s%3600/60));$('s').textContent=z(s%60);
    $('restante').textContent=s>=86400?Math.floor(s/86400)+' dias':z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60));
    $('anel').style.strokeDashoffset=2*Math.PI*44*(1-falta/(t1-t0));$('relogio').classList.toggle('urgente',s<3600)}
  if(estava!==ativa){estava=ativa;desenhar();desenharCarrinho()}
}

/* vitrine */
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filtro=b.dataset.f;busca='';desenhar();$('conteudo').scrollIntoView({behavior:'smooth'})}});
$('busca').onsubmit=e=>{e.preventDefault();busca=$('q').value.trim().toLowerCase();filtro='todos';desenhar()};
const ZAP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
const SHARE='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const achar=id=>CFG&&CFG.produtos.find(p=>String(p.id)===String(id));
const fotoDe=p=>p.foto||catDe(p).foto||'';
const urlP=p=>location.origin+'/p/'+encodeURIComponent(p.id);
const textoP=p=>'*'+p.nome+'*\n'+(pa()&&p.promo!==false?'De '+brl(p.preco)+' por *'+brl(preco(p))+'*':'*'+brl(preco(p))+'*')+'\n'+urlP(p);
const linkZap=p=>'https://wa.me/'+(CFG.loja?.whatsapp||'')+'?text='+encodeURIComponent('Olá! Tenho interesse neste produto:\n'+textoP(p));
const arq={};
function aquecer(id){ // baixa a foto antes do toque, para o compartilhamento abrir na hora
  if(arq[id])return arq[id];const p=achar(id),u=p&&fotoDe(p);
  return arq[id]=u?fetch(u).then(r=>r.ok?r.blob():Promise.reject()).then(b=>new File([b],'produto.jpg',{type:b.type||'image/jpeg'})).catch(()=>false):Promise.resolve(false)}
const aquecerCard=e=>{const c=e.target.closest&&e.target.closest('.card');if(c)aquecer(c.id.slice(3))};
document.addEventListener('pointerover',aquecerCard);document.addEventListener('touchstart',aquecerCard,{passive:true});
async function compartilhar(id){
  const p=achar(id),texto=textoP(p),f=await aquecer(id);
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:texto,title:p.nome});return}catch(e){if(e.name==='AbortError')return}}
  const link='https://wa.me/?text='+encodeURIComponent(texto);window.open(link,'_blank','noopener')||(location.href=link);
}
function destacar(){const id=new URLSearchParams(location.search).get('produto');if(!id)return;const el=document.getElementById('pd-'+id);if(el){el.scrollIntoView({block:'center'});el.classList.add('dest')}}
function card(p){const c=catDe(p),o=p.foto?p:c,nm=esc(p.nome),pid=esc(p.id);return `<div class="card" id="pd-${pid}"><div class="foto" style="${bg(o)}">${o.foto?'':esc(p.nome[0])}</div>
 <div class="info"><div>${nm}</div><div class="preco">${pa()&&p.promo!==false?`<span class="antigo">${brl(p.preco)}</span>`:''}${brl(preco(p))}</div>
 ${pa()&&p.promo!==false?`<div class="etiqueta">-${CFG.promo.desconto}% até ${new Date(t1).toLocaleDateString('pt-BR')}</div>`:''}
 <div class="acoes"><button class="btn" onclick="add('${pid}')">Adicionar</button>
 <a class="ic zap" href="${esc(linkZap(p))}" target="_blank" rel="noopener" aria-label="Falar sobre ${nm} no WhatsApp" title="Falar com a loja no WhatsApp">${ZAP}</a>
 <button class="ic" onclick="compartilhar('${pid}')" aria-label="Compartilhar ${nm}" title="Compartilhar foto e preço">${SHARE}</button></div></div></div>`}
function desenhar(){
  document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
  const vis=CFG.produtos.filter(p=>p.ativo!==false);let h='';
  if(filtro!=='todos'||busca){
    const l=vis.filter(p=>(filtro==='todos'||p.cat===filtro)&&(!busca||p.nome.toLowerCase().includes(busca)));
    const t=busca?'Resultados para "'+esc(busca)+'"':esc((CFG.categorias.find(c=>c.id===filtro)||{}).nome);
    h=`<h2>${t}</h2><div class="grade">${l.map(card).join('')||'<p class="vazio">Nenhuma peça encontrada.</p>'}</div>`;
  }else[1,2].forEach(n=>{const s=CFG['secao'+n]||{},l=vis.filter(p=>+p.secao===n);if(s.ativa!==false&&l.length)h+=`<h2>${esc(s.titulo)}</h2><div class="grade">${l.map(card).join('')}</div>`});
  $('conteudo').innerHTML=h||'<p class="vazio">Em breve, novidades por aqui.</p>';
}

/* carrinho */
function add(id){const i=cart.find(c=>c.id===id);i?i.qtd++:cart.push({id,qtd:1});salvar();desenharCarrinho();abrirC()}
function mudar(id,d){const i=cart.find(c=>c.id===id);i.qtd+=d;cart=cart.filter(c=>c.qtd>0);salvar();desenharCarrinho()}
function desenharCarrinho(){
  cart=cart.filter(c=>CFG.produtos.some(p=>String(p.id)===c.id&&p.ativo!==false));let tot=0,n=0;
  $('itens').innerHTML=cart.map(c=>{const p=CFG.produtos.find(x=>String(x.id)===c.id);tot+=preco(p)*c.qtd;n+=c.qtd;
   return `<div class="linha"><div>${esc(p.nome)}<br><small>${brl(preco(p))}</small></div><div class="qtd"><button onclick="mudar('${esc(c.id)}',-1)">−</button> ${c.qtd} <button onclick="mudar('${esc(c.id)}',1)">+</button></div></div>`}).join('')||'<p>Seu carrinho está vazio.</p>';
  $('total').textContent=brl(tot);$('cont').textContent=n;
}
const abrirC=()=>{$('gaveta').classList.add('aberta');$('veu').classList.add('on')},fecharC=()=>{$('gaveta').classList.remove('aberta');$('veu').classList.remove('on')};
$('abrir').onclick=abrirC;$('fechar').onclick=fecharC;$('veu').onclick=fecharC;
try{const c=JSON.parse(localStorage.getItem('cli')||'{}');$('cliNome').value=c.nome||'';$('cliTel').value=c.tel||''}catch(e){}
$('pagar').onclick=async()=>{
  if(!cart.length)return;
  const nome=$('cliNome').value.trim(),tel=$('cliTel').value.replace(/\D/g,'');
  if(nome.length<2||tel.length<10){alert('Preencha seu nome e seu WhatsApp com DDD para continuar.');(nome.length<2?$('cliNome'):$('cliTel')).focus();return}
  try{localStorage.setItem('cli',JSON.stringify({nome,tel}))}catch(e){}
  $('pagar').disabled=true;$('pagar').textContent='Abrindo pagamento…';
  try{const r=await fetch('/api/checkout',{method:'POST',body:JSON.stringify({itens:cart,cliente:{nome,tel}})});const d=await r.json();if(!d.url)throw new Error(d.erro);
    try{localStorage.setItem('pedido',JSON.stringify({numero:d.numero,resumo:d.resumo}))}catch(e){}
    location.href=d.url}
  catch(e){alert('Não foi possível iniciar o pagamento: '+e.message);$('pagar').disabled=false;$('pagar').textContent='Pagar com Mercado Pago'}
};
init();
</script>
